version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vasalto_competencias_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vasalto_competencias
      MYSQL_ROOT_PASSWORD: root_secure_pass
      MYSQL_USER: vasalto_user
      MYSQL_PASSWORD: vasalto_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secure_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - efi_network

  app:
    build: .
    container_name: vasalto_competencias_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=vasalto_competencias
      - DB_USER=root
      - DB_PASS=root_secure_pass
    depends_on:
      - db
    networks:
      - efi_network

networks:
  efi_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
