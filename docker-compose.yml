version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vasalto_competencias_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vasalto_competencias
      MYSQL_ROOT_PASSWORD: root_secure_pass
      MYSQL_USER: vasalto_user
      MYSQL_PASSWORD: vasalto_pass
    ports:
      - "3306:3306"
    volumes:
      # Scripts SQL ejecutados en orden alfabético al inicializar el contenedor
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      # Volumen persistente para los datos de MySQL
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secure_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local
